<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Hexagon / Shield -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="#0F172A" stroke="url(#grad-pulse)" stroke-width="3" />
  
  <!-- Urban Skyline Silhouette inside -->
  <path d="M22 68 L22 48 L32 48 L32 40 L42 40 L42 54 L52 54 L52 32 L64 32 L64 45 L74 45 L74 68 Z" fill="#1E293B" opacity="0.6"/>
  
  <!-- Civic Pulse Wave -->
  <path d="M18 58 L32 58 L38 42 L46 72 L54 36 L62 62 L68 54 L82 54" 
        fill="none" 
        stroke="url(#grad-pulse)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Core AI Node -->
  <circle cx="54" cy="36" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="46" cy="72" r="3" fill="#8B5CF6" />
</svg>
